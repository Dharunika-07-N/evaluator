<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Management - Admin</title>
    <link rel="stylesheet" href="css/mcq-management.css">
    <link rel="stylesheet" href="css/admin-nav.css">
</head>

<body>
    <nav class="admin-navbar">
        <div class="admin-nav-content">
            <a href="admin-results.html" class="admin-nav-brand">📊 Admin System</a>
            <div class="admin-nav-links">
                <a href="admin-results.html" class="admin-nav-link">Results</a>
                <a href="exam-management.html" class="admin-nav-link">Exams</a>
                <a href="mcq-management.html" class="admin-nav-link">MCQs</a>
                <a href="question-upload.html" class="admin-nav-link">Bulk Upload</a>
                <a href="profile.html" class="admin-nav-link">Settings</a>
            </div>
            <div class="admin-nav-right">
                <span class="admin-role-badge">Admin</span>
                <button class="btn-logout-nav" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container">
        <header>
            <h1>MCQ Question Management</h1>
        </header>

        <div class="content">
            <!-- Generate Questions Section -->
            <section class="section">
                <h2>Generate Questions from Web</h2>
                <form id="generateForm">
                    <div class="form-group">
                        <label for="url">Website URL:</label>
                        <input type="url" id="url" name="url" placeholder="https://example.com/article" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="topic">Topic:</label>
                            <input type="text" id="topic" name="topic" placeholder="e.g., Python Programming" required>
                        </div>
                        <div class="form-group">
                            <label for="numQuestions">Number of Questions:</label>
                            <input type="number" id="numQuestions" name="numQuestions" min="1" max="20" value="5">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Generate Questions</button>
                </form>
                <div id="generateStatus" class="status-message"></div>
            </section>

            <!-- Manual Question Entry Section -->
            <section class="section">
                <h2>Add Question Manually</h2>
                <button id="toggleManualForm" class="btn-secondary">Show Manual Entry Form</button>
                <form id="manualForm" style="display: none;">
                    <div class="form-group">
                        <label for="manualQuestion">Question:</label>
                        <textarea id="manualQuestion" name="question" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="manualTopic">Topic:</label>
                        <input type="text" id="manualTopic" name="topic" placeholder="e.g., JavaScript" required>
                    </div>
                    <div class="options-grid">
                        <div class="form-group">
                            <label for="optionA">Option A:</label>
                            <input type="text" id="optionA" name="option_a" required>
                        </div>
                        <div class="form-group">
                            <label for="optionB">Option B:</label>
                            <input type="text" id="optionB" name="option_b" required>
                        </div>
                        <div class="form-group">
                            <label for="optionC">Option C:</label>
                            <input type="text" id="optionC" name="option_c" required>
                        </div>
                        <div class="form-group">
                            <label for="optionD">Option D:</label>
                            <input type="text" id="optionD" name="option_d" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="correctAnswer">Correct Answer:</label>
                        <select id="correctAnswer" name="correct_answer" required>
                            <option value="">Select correct answer</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Add Question</button>
                    <button type="button" id="cancelManual" class="btn-secondary">Cancel</button>
                </form>
                <div id="manualStatus" class="status-message"></div>
            </section>

            <!-- Questions List Section -->
            <section class="section">
                <h2>All Questions</h2>
                <div class="filter-bar">
                    <input type="text" id="searchTopic" placeholder="Filter by topic...">
                    <button onclick="loadQuestions()" class="btn-secondary">Refresh</button>
                </div>
                <div id="questionsList">
                    <p class="loading">Loading questions...</p>
                </div>
            </section>
        </div>
    </div>

    <script src="js/admin-nav.js"></script>
    <script src="js/mcq-management.js"></script>
</body>

</html>
