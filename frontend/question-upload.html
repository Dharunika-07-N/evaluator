<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Questions - Admin</title>
    <link rel="stylesheet" href="css/question-upload.css">
    <link rel="stylesheet" href="css/admin-nav.css">
</head>

<body>
    <nav class="admin-navbar">
        <div class="admin-nav-content">
            <a href="admin-results.html" class="admin-nav-brand">📊 Admin System</a>
            <div class="admin-nav-links">
                <a href="admin-results.html" class="admin-nav-link">Results</a>
                <a href="exam-management.html" class="admin-nav-link">Exams</a>
                <a href="mcq-management.html" class="admin-nav-link">MCQs</a>
                <a href="question-upload.html" class="admin-nav-link">Bulk Upload</a>
                <a href="profile.html" class="admin-nav-link">Settings</a>
            </div>
            <div class="admin-nav-right">
                <span class="admin-role-badge">Admin</span>
                <button class="btn-logout-nav" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container">
        <header>
            <h1>Upload Questions</h1>
        </header>

        <section class="section">
            <h2>Bulk Upload from File</h2>
            <p class="help-text">
                Supported formats: <strong>.csv</strong> and <strong>.json</strong>
            </p>

            <div class="sample-box">
                <h3>CSV format (header required)</h3>
                <code>question_text,option_a,option_b,option_c,option_d,correct_answer,topic</code>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="questionFile">Select file</label>
                    <input type="file" id="questionFile" accept=".csv,.json" required>
                </div>
                <button type="submit" class="btn-primary">Upload Questions</button>
            </form>

            <div id="uploadStatus" class="status-message"></div>
        </section>

        <section class="section">
            <h2>Preview</h2>
            <div id="previewEmpty" class="empty-preview">No file parsed yet.</div>
            <div id="previewTableWrapper" class="table-wrapper" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Question</th>
                            <th>Topic</th>
                            <th>Correct</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="js/admin-nav.js"></script>
    <script src="js/question-upload.js"></script>
</body>

</html>
